{% extends "base.html" %}


{% block title %}
    Edit Exercise | Beginner Fitness Tracker
{% endblock %}


{% block container_class %}
    small-page-container
{% endblock %}


{% block content %}
    <section class="page-heading">
        <h1>Edit exercise</h1>

        <p class="secondary-text">
            Update the exercise details below.
        </p>
    </section>


    <section class="create-panel">
        <form
            method="post"
            class="stacked-form"
        >
            <div class="form-field">
                <label for="exercise-name">
                    Exercise name
                </label>

                <input
                    type="text"
                    id="exercise-name"
                    name="name"
                    value="{{ exercise['name'] }}"
                    autocomplete="off"
                    required
                >
            </div>


            <div class="form-field">
                <label for="primary-muscle">
                    Primary muscle
                </label>

                <select
                    id="primary-muscle"
                    name="primary_muscle"
                    required
                >
                    <option value="">
                        Select a primary muscle
                    </option>

                    {% for muscle in primary_muscles %}
                        <option
                            value="{{ muscle }}"
                            {% if
                                exercise["primary_muscle"]
                                == muscle
                            %}
                                selected
                            {% endif %}
                        >
                            {{ muscle }}
                        </option>
                    {% endfor %}
                </select>
            </div>


            <div class="form-field">
                <label for="equipment">
                    Equipment
                </label>

                <select
                    id="equipment"
                    name="equipment"
                    required
                >
                    <option value="">
                        Select equipment
                    </option>

                    {% for equipment in equipment_options %}
                        <option
                            value="{{ equipment }}"
                            {% if
                                exercise["equipment"]
                                == equipment
                            %}
                                selected
                            {% endif %}
                        >
                            {{ equipment }}
                        </option>
                    {% endfor %}
                </select>
            </div>


            <div class="form-actions">
                <button
                    type="submit"
                    class="primary-button"
                >
                    Save changes
                </button>

                <a
                    class="secondary-button"
                    href="{{ url_for('exercises.exercise_library') }}"
                >
                    Cancel
                </a>
            </div>
        </form>
    </section>
{% endblock %}
